<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>hello, i'm popo — the lamp, in 3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<svg class="sprite" aria-hidden="true" focusable="false">
  <defs>
    <filter id="blobRough" x="-10%" y="-20%" width="120%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.035 0.06" numOctaves="2" seed="4" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <path id="blob-path" d="M 8 21 C 22 9 58 5 100 5 C 146 5 182 11 192 23 C 196 31 196 52 191 62 C 179 74 144 79 100 79 C 57 79 21 74 9 62 C 4 52 4 31 8 21 Z" />
  </defs>
</svg>

<main class="scene">
  <canvas id="stage" aria-label="A desk lamp that turns to follow your cursor"></canvas>

  <div class="grain" aria-hidden="true"></div>

  <header class="intro">
    <p class="hand">hello, i'm popo</p>
    <nav class="menu" aria-label="sections">
      <a class="item" href="#writings">
        <span class="blob" aria-hidden="true"><svg viewBox="0 0 200 84" preserveAspectRatio="none"><use href="#blob-path" filter="url(#blobRough)" fill="#f6f2e8" /></svg></span>
        <span class="num" aria-hidden="true">i</span>
        <span class="label">writings</span>
      </a>
      <a class="item" href="#top-posts">
        <span class="blob" aria-hidden="true"><svg viewBox="0 0 200 84" preserveAspectRatio="none"><use href="#blob-path" filter="url(#blobRough)" fill="#f6f2e8" /></svg></span>
        <span class="num" aria-hidden="true">ii</span>
        <span class="label">top posts</span>
      </a>
      <a class="item" href="#journey">
        <span class="blob" aria-hidden="true"><svg viewBox="0 0 200 84" preserveAspectRatio="none"><use href="#blob-path" filter="url(#blobRough)" fill="#f6f2e8" /></svg></span>
        <span class="num" aria-hidden="true">iii</span>
        <span class="label">journey</span>
      </a>
      <a class="item" href="#recs">
        <span class="blob" aria-hidden="true"><svg viewBox="0 0 200 84" preserveAspectRatio="none"><use href="#blob-path" filter="url(#blobRough)" fill="#f6f2e8" /></svg></span>
        <span class="num" aria-hidden="true">iv</span>
        <span class="label">recs</span>
      </a>
      <a class="item" href="#contact">
        <span class="blob" aria-hidden="true"><svg viewBox="0 0 200 84" preserveAspectRatio="none"><use href="#blob-path" filter="url(#blobRough)" fill="#f6f2e8" /></svg></span>
        <span class="num" aria-hidden="true">v</span>
        <span class="label">contact</span>
      </a>
    </nav>
  </header>
</main>

<script type="module" src="scene.js"></script>
</body>
</html>
